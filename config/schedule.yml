purge_inbound_webhook_events_job:
  cron: "17 3 * * *"
  class: "Webhooks::PurgeInboundEventsJob"
  queue: low
  description: "Deletes inbound_webhook_events older than WEBHOOK_EVENT_RETENTION_DAYS (default 30)"

purge_session_recordings_job:
  cron: "23 * * * *"
  class: "AdminJobs::PurgeSessionRecordingsJob"
  queue: low
  description: "Deletes rrweb session recordings older than SESSION_RECORDING_RETENTION_HOURS (default 48)"

persistent_signin_flush_job:
  cron: "*/15 * * * *"
  class: "StatsJobs::PersistentSigninFlushJob"
  queue: administration

# ── COD Form (docs/cod-form/ARCHITECTURE.md I.1, I.4, J.2) ─────────────────────
cod_form_analytics_rollup_job:
  cron: "7 * * * *"
  class: "CodForm::Analytics::RollupJob"
  queue: low
  description: "Hourly: recomputes today and yesterday (shop time zone) of cod_form_daily_stats for shops with form activity"

cod_form_analytics_purge_job:
  cron: "41 3 * * *"
  class: "CodForm::Analytics::PurgeJob"
  queue: low
  description: "Daily: deletes cf_* form_funnel_events older than 90 days in batches of 5000 (rollups are kept)"

cod_form_abandonment_sweep_job:
  cron: "*/5 * * * *"
  class: "CodForm::Abandonment::SweepJob"
  queue: low
  description: "Every 5 min: form sessions idle 15 min with a phone or email become abandoned carts (source cod_form)"

cod_form_overage_billing_job:
  cron: "30 2 * * *"
  class: "CodForm::OverageBillingJob"
  queue: administration
  description: "Daily 02:30 UTC: bills form orders beyond the plan cap. Inert unless a plan_limits row has an overage_rate"

# WS3 (docs/cod-form/snippets/ws3-schedule.yml.md): retention of cod_form_sessions
cod_form_session_purge_job:
  cron: "40 3 * * *"
  class: "CodForm::SessionPurgeJob"
  queue: low
  description: "Daily 03:40 UTC: deletes form sessions older than 90 days, blanks buyer data on ordered sessions older than 30 days"

cod_form_pre_upsell_refresh_job:
  cron: "25 4 * * *"
  class: "CodForm::PreUpsellRefreshJob"
  queue: low
  description: "Daily 04:25 UTC: refreshes the products of active pre-purchase upsell rules (collection rules follow their collection)"

whatsapp_attribution_sweep_job:
  cron: "*/15 * * * *"
  class: "Whatsapp::AttributionSweepJob"
  queue: low
  args: [2]
  description: "Every 15m: attributes new orders to the last delivered WhatsApp campaign or notification"

whatsapp_attribution_backfill_job:
  cron: "20 3 * * *"
  class: "Whatsapp::AttributionSweepJob"
  queue: low
  args: [72]
  description: "Daily 03:20 UTC: re-sweeps 72h of attribution to catch late delivery webhooks and cancellations"

whatsapp_contact_order_stats_full_job:
  cron: "40 2 * * *"
  class: "Whatsapp::ContactOrderStatsJob"
  queue: low
  args: ["full"]
  description: "Daily: recomputes COD/prepaid/RTO order stats on WhatsApp contacts for every shop with contacts"

whatsapp_contact_order_stats_incremental_job:
  cron: "5 * * * *"
  class: "Whatsapp::ContactOrderStatsJob"
  queue: low
  args: ["incremental"]
  description: "Hourly: refreshes contact order stats for phones whose orders or RTO status changed in the last 2h"

whatsapp_account_health_sync_job:
  cron: "*/30 * * * *"
  class: "Whatsapp::AccountHealthSyncJob"
  queue: administration
  description: "Every 30m: refreshes WhatsApp number quality/messaging limit from Meta and auto-pauses campaigns on low quality"

whatsapp_inbox_auto_resolve_job:
  cron: "*/15 * * * *"
  class: "Whatsapp::Inbox::AutoResolveJob"
  queue: low
  description: "Every 15m: resolves inbox conversations pending for 72h without a customer reply"

whatsapp_inbox_unanswered_alert_job:
  cron: "*/10 * * * *"
  class: "Whatsapp::Inbox::UnansweredAlertJob"
  queue: low
  description: "Every 10m: emails the assignee about open conversations unanswered past the shop's threshold (opt-in)"

whatsapp_inbox_media_retention_job:
  cron: "20 3 * * *"
  class: "Whatsapp::Inbox::MediaRetentionJob"
  queue: low
  description: "Daily: purges stored inbox media older than 90 days"

whatsapp_ai_reconcile_recharges_job:
  cron: "*/30 * * * *"
  class: "Whatsapp::Ai::ReconcileRechargesJob"
  queue: low
  description: "Every 30m: credits AI credit packs approved in Shopify when the merchant never returned to the app"

ops_gmv_rollup_job:
  cron: "10 * * * *"
  class: "Ops::GmvRollupJob"
  queue: administration
  args: [2]
  description: "Hourly: rolls today + yesterday (IST) of order_confirmations into ops_gmv_dailies for /codk-ops"

customer_bulk_export_job:
  cron: "* * * * *"
  class: "ShopifyJobs::CustomerBulkExportJob"
  queue: administration
  description: "Every minute, single instance via JobLock: polls and terminates stuck Shopify bulk exports, starts new ones for the shops with the most unloaded customers. Does nothing unless CUSTOMER_BULK_EXPORT_ENABLED=true; stopped by the customer_sync_controls kill switch"

customer_bulk_load_job:
  cron: "* * * * *"
  class: "ShopifyJobs::CustomerBulkLoadJob"
  queue: global_data_pull
  description: "Every minute, single instance via JobLock: loads finished Shopify bulk customer exports into the DB, throttled, inside OPS_BULK_LOAD_WINDOW (IST). Does nothing unless CUSTOMER_BULK_LOAD_ENABLED=true; stopped by the customer_sync_controls kill switch"
