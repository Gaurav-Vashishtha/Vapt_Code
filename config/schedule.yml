charge_calculation_job:
  cron: "0 */4 * * *"
  class: "PricingJobs::DynamicChargeCoordinatorJob"
  queue: administration

order_reports_job:
  cron: "0 */4 * * *"
  class: "SidekiqJobs::OrdersReport"
  queue: administration

easysell_usage_job:
  cron: "0 2 * * *"
  class: "PricingJobs::EasysellUsageJob"
  queue: administration

settings_lock_job:
  cron: "0 1 * * *"
  class: "SidekiqJobs::SettingsLockJob"
  queue: administration

provider_failover_job:
  cron: "*/15 * * * *"
  class: "AdminJobs::IntegrationFailoverJob"
  queue: administration

price_updation_job:
  cron: "0 0 * * *"
  class: "PricingJobs::CountrywisePriceJob"
  queue: administration

province_refresh_job:
  cron: "0 0 * * *"
  class: "ShopifyJobs::ProvinceRefreshJob"
  queue: administration
  
auto_cancel_job:
  cron: "*/3 * * * *"
  class: "ShopifyJobs::AutoCancelJob"
  queue: administration

retry_verification_job:
  cron: "*/3 * * * *"
  class: "ShopifyJobs::RetryVerificationJob"
  queue: administration

abandoned_cart_schedule_job:
  cron: "*/10 * * * *"
  class: "NetworkJobs::AbandonedCartScheduleJob"
  queue: administration

# BSP abandoned-cart reminder scheduler. Runs alongside the MSG91 job but
# the MSG91 path skips shops with BSP bindings, so a shop is on exactly one.
bsp_abandoned_cart_reminders_job:
  cron: "*/10 * * * *"
  class: "Whatsapp::ScheduleAbandonedCartRemindersJob"
  queue: administration


auto_verify_job:
  cron: "*/1 * * * *"
  class: "ShopifyJobs::AutoVerifyJob"
  queue: administration

cod_prepaid_job:
  cron: "*/55 * * * *"
  class: "ShopifyJobs::CodPrepaidJob"
  queue: administration

restart_job:
  cron: "*/30 * * * *"
  class: "SidekiqJobs::RestartAppJob"
  queue: restarts

webhook_refresh:
  cron: "0 1 * * *"
  class: "SidekiqJobs::WebhookRemoveJob"
  queue: administration

sqs_consumer_job:
  cron: "* * * * *"
  class: "ShopifyJobs::SqsConsumerJob"
  queue: sqs

customer_create_sqs_consumer_job:
  cron: "* * * * *"
  class: "ShopifyJobs::CustomerCreateSqsConsumerJob"
  queue: customer_create_sqs
  description: "Drains the customers/create SQS queue; self-reschedules every 4s while messages exist. Kill switch: SQS_CUSTOMER_CREATE_CONSUMER_ENABLED=false"
  
sqs_order_create_consumer_job:
  cron: "* * * * * *"
  class: "ShopifyJobs::SqsOrderCreateConsumerJob"
  queue: sqs

prepaid_conversion_job:
  cron: "*/1 * * * *"
  class: "ShopifyJobs::PrepaidConversionJob"
  queue: administration

prepaid_fallback_conversion_job:
  cron: "*/45 * * * *"
  class: "ShopifyJobs::PrepaidFallbackConversionJob"
  queue: administration

scheduled_shop_reports_tick_job:
  cron: "0 * * * *" # hourly UTC; enqueues a single drain job if none running (due sends only after local send time; no perform_at)
  class: "ScheduledReports::TickJob"
  queue: default
  description: "Hourly: one drain pass for scheduled report emails (serialized mail lock; low-priority deliver queue)"

refresh_recent_lightweight_metafields_job:
  cron: "0 */2 * * *"
  class: "ShopifyJobs::RefreshRecentLightweightMetafieldsJob"
  queue: scheduled_report_delivery
  description: "Every 2 hours: inline refresh lightweight settings metafields for shops updated in last 24h"

customer_count_sync_job:
  cron: "30 19 * * *"
  class: "ShopifyJobs::CustomerCountSyncJob"
  queue: administration
  description: "01:00 IST daily: syncs the Shopify customer count of active installed shops into customer_sync_states (unloaded = Shopify count - loaded baseline)"

email_scheduler_job:
  cron: "0 */6 * * *"  # Every 6 hours
  class: "EmailSchedulerJob"
  queue: default
  description: "Finds candidates for each email rule, re-validates and sends scheduled emails (no duplicate per rule+shop)"

zip_refresh_job:
  cron: "0 */20 * * *"
  class: "NetworkJobs::ZipcodeRefreshJob"
  queue: administration

aws_script_copy_job:
  cron: "0 */21 * * *"
  class: "NetworkJobs::AwsScriptCopyJob"
  queue: administration

aws_notifik_script_copy_job:
  cron: "0 */22 * * *"
  class: "NetworkJobs::AwsNotifikScriptCopyJob"
  queue: administration

partial_cleanup_job:
  cron: "*/1 * * * *"
  class: "ShopifyJobs::PartialProductCleanupJob"
  queue: administration

preorder_abandonment_job:
  cron: "*/15 * * * *"
  class: "AdminJobs::PreOrderOtpAbandonmentJob"
  queue: administration

active_subscription_usage_job:
  cron: "0 1 * * *"
  class: "PricingJobs::SubscriptionActiveCoordinatorJob"
  queue: administration

notification_scheduler_job:
  cron: "30 2 * * *"  # 8:00 AM IST
  class: "SidekiqJobs::NotificationSchedulerJob"
  queue: administration
  description: "Sends scheduled merchant notifications every day at 3 AM IST"

incorrect_setup_job:
  cron: "30 4 * * *"  # 10:00 AM IST
  class: "SidekiqJobs::IncorrectSetupJob"
  queue: administration
  description: "Finds incorrect pre order otp setup"

pre_order_otp_cart_schedule_job:
  cron: "*/30 * * * *"
  class: "NetworkJobs::PreOrderOtpCartScheduleJob"
  queue: administration
  description: "Schedules Abandoned carts for pre order otps"

partial_payment_check_job:
  cron: "*/5 * * * *"
  class: "ShopifyJobs::PartialPaymentCheckJob"
  queue: administration
  description: "Checks if some missed partial job"

reconcile_missed_orders_job:
  cron: "0 * * * *"
  class: "ShopifyJobs::ReconcileMissedOrdersJob"
  queue: administration
  description: "Hourly: lists Shopify order IDs (last 90m) for partial-payment shops, reprocesses any with no OrderConfirmation. Kill switch: RECONCILE_MISSED_ORDERS_ENABLED=false"

churn_rollup_job:
  cron: "30 1 * * *"
  class: "Churn::RollupJob"
  queue: administration
  description: "Daily: per-shop activity/MRR/risk rollups + Slack alerts + win-back enqueue for high-value at-risk shops"

churn_partner_sales_sync_job:
  cron: "0 * * * *"
  class: "Churn::PartnerSalesSyncJob"
  queue: administration
  description: "Hourly: pulls subscription/usage/adjustment sales from the Shopify Partner API into partner_sales + billing_events"

churn_churned_stores_sync_job:
  cron: "45 2 * * *"
  class: "Churn::ChurnedStoresSyncJob"
  queue: administration
  args: [30, "schedule"]
  description: "Daily: rebuilds churned_stores (uninstalls, subscription cancellations, downgrades to Free) for the last 30 days with Partner API LTV + reinstall metrics"

churn_weekly_digest_job:
  cron: "0 6 * * 1"
  class: "Churn::WeeklyDigestJob"
  queue: administration
  description: "Weekly (Mon 6am UTC): churn KPIs + retention + top reasons + biggest at-risk accounts to CHURN_DIGEST_RECIPIENTS"

whatsapp_campaign_scheduler_job:
  cron: "* * * * *"
  class: "Whatsapp::CampaignSchedulerJob"
  queue: whatsapp_bsp_campaign
  description: "Every minute: promotes due scheduled WhatsApp campaigns to sending"

whatsapp_template_translation_status_sync_job:
  cron: "*/30 * * * *"
  class: "Whatsapp::TemplateTranslationStatusSyncJob"
  queue: default
  description: "Every 30m: refreshes Meta review status of default-number WhatsApp template translations (Urdu/Arabic)"

whatsapp_reattempt_dispatch_job:
  cron: "*/5 * * * *"
  class: "Whatsapp::ReattemptDispatchJob"
  queue: default
  description: "Every 5m: resends WhatsApp messages refused with a retryable code (131049) once their retry is due (MSG91_/BSP_WHATSAPP_RETRY_* env)"

whatsapp_campaign_stats_reconcile_job:
  cron: "*/15 * * * *"
  class: "Whatsapp::CampaignStatsReconcileJob"
  queue: whatsapp_bsp_campaign
  description: "Every 15m: reconciles campaign counters against recipient statuses"
partial_payment_product_fallback_cleanup_job:
  cron: "0 2 * * *"
  class: "ShopifyJobs::PartialPaymentCleanupJob"
  queue: administration
  description: "Runs a missed deletions."

process_piled_up_sqs_messages:
  cron: "*/3 * * * *"
  class: "ShopifyJobs::SqsBatchProcessorJob"
  queue: administration

partial_discount_automatic_app_ensure_offline_job:
  cron: "*/30 * * * *"
  class: "OfflineJobs::EnqueuePartialDiscountAutomaticAppForPartialPaymentShopsJob"
  queue: administration
  description: "Ensures partial-payment shops have an automatic app discount GID stored"

referral_earning_sync_job:
  cron: "0 3 * * *"
  class: "NetworkJobs::ReferralRevenueSyncJob"
  queue: administration

engagement_report_job:
  cron: "0 5 * * *"  # 5:00 AM UTC (10:30 AM IST)
  class: "SidekiqJobs::EngagementReportJob"
  queue: administration
  description: "Sends daily engagement report email at 5 AM UTC"

subscription_charge_sync_job:
  cron: "0 4 * * *"
  class: "PricingJobs::SubscriptionChargeSyncJob"
  queue: administration
  description: "Syncs charge_id and plan from Shopify for shops with id > 40000"

build_call_queue_job:
  cron: "30 2 * * 1-6"  # 08:00 IST, Mon-Sat (no Sunday calling)
  class: "SupportCalls::BuildDailyQueueJob"
  queue: administration
  description: "Builds the ranked support call queue for the day (mix + cooldown + rotation)"

call_calendar_morning_email_job:
  cron: "0 3 * * 1-6"  # 08:30 IST, Mon-Sat
  class: "SupportCalls::MorningQueueEmailJob"
  queue: administration
  description: "Emails the day's call queue to WHATSAPP_APPROVERS_EMAIL_LIST"

parcelx_credit_alert_job:
  cron: "45 3 * * *"  # 09:15 IST, daily
  class: "AdminJobs::ParcelxCreditAlertJob"
  queue: administration
  description: "Probes ParcelX for x-remaining-credits; emails WHATSAPP_APPROVERS_EMAIL_LIST when below PARCELX_CREDIT_ALERT_THRESHOLD (default 20000)"

call_calendar_evening_report_job:
  cron: "30 14 * * 1-6"  # 20:00 IST, Mon-Sat
  class: "SupportCalls::EveningReportEmailJob"
  queue: administration
  description: "Emails end-of-day call results to WHATSAPP_APPROVERS_EMAIL_LIST"

merchant_whatsapp_scheduler_job:
  cron: "0 * * * *"  # hourly
  class: "MerchantWhatsapp::SchedulerJob"
  queue: administration
  description: "Builds/dispatches scheduled merchant WhatsApp notifications (gated by MERCHANT_WA_ENABLED)"

merchant_whatsapp_weekly_digest_job:
  cron: "0 5 * * 1"  # Monday 10:30 IST
  class: "MerchantWhatsapp::WeeklyDigestJob"
  queue: administration
  description: "Sends the weekly merchant digest (gated by MERCHANT_WA_ENABLED)"

order_shipping_status_sync_parent_job:
  cron: "30 21 * * *"  # 3:00 AM IST (Asia/Kolkata) daily; server cron is UTC
  class: "ShopifyJobs::OrderShippingStatusSyncParentJob"
  queue: default
  description: "Syncs Shopify shipping status for order_confirmations (14d lookback, 12h shop cooldown)"

rto_backfill_coordinator_job:
  cron: "*/1 * * * *"
  class: "Rto::BackfillCoordinatorJob"
  queue: low
  description: "Fans out RTO backfill across eligible shop_domains (respects BACKFILL_PARALLELISM and leases)"

rto_incremental_reconcile_coordinator_job:
  cron: "*/1 * * * *"
  class: "Rto::IncrementalReconcileCoordinatorJob"
  queue: low
  description: "Fans out RTO incremental reconcile (updated_at polling) across installed shop_domains (respects BACKFILL_PARALLELISM and reconcile leases)"

