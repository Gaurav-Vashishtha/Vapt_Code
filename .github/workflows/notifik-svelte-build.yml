name: Build Notifik Svelte App (Prod)

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Svelte App
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js 22 (replacement for nvm use 22)
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notifik-svelte-app/package-lock.json

      # 3️⃣ Verify Node version
      - name: Verify Node version
        run: node -v

      # 4️⃣ Install dependencies
      - name: Install dependencies
        working-directory: notifik-svelte-app
        run: npm ci

      # 5️⃣ Run production build
      - name: Build production bundle
        working-directory: notifik-svelte-app
        run: npm run build:prod

      # 6️⃣ Print generated JS & CSS paths (IMPORTANT)
      - name: Show generated assets
        run: |
          echo "✅ Build completed successfully"
          echo ""
          echo "📦 Generated JS & CSS files:"
          echo "------------------------------------"
          find public/notifik-svelte-app -type f \( -name "*.js" -o -name "*.css" \)
          echo "------------------------------------"

      # 7️⃣ Optional: Upload build artifacts (for download/debug)
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notifik-svelte-build
          path: public/notifik-svelte-app
